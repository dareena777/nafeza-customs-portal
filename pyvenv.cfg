import re
from typing import Any, Dict, List, Optional

import cv2
import easyocr
import fitz  # PyMuPDF
import numpy as np
import torch
from symspellpy import SymSpell, Verbosity

from dpi import DPINormalizer


class ArabicSpellCorrector:
    """
    Compares extracted OCR terms against a valid Arabic domain dictionary
    to fix misread characters and missing dots (e.g., مركر -> مركز).
    """

    def __init__(self):
        self.sym_spell = SymSpell(max_dictionary_edit_distance=2, prefix_length=7)
        self._load_dictionary()

    def _load_dictionary(self):
        domain_vocabulary = [
            "مركز", "مصلحة", "الجمارك", "المصرية", "شركة", "الإسكندرية", 
            "القاهرة", "فاتورة", "إيصال", "المدفوعة", "المحصل", "القيمة",
            "توريدات", "تسليم", "تأمينات", "العنوان", "الإجمالي", "المرجع",
            "اللوجستية", "عقد", "استيراد", "تصدير", "مبلغ", "صادر", "وارد",
            "شارع", "محافظة", "منطقة", "طريق", "حساب", "ضريبة"
        ]
        for word in domain_vocabulary:
            self.sym_spell.create_dictionary_entry(word, 1000)

    def correct_text(self, text: str) -> str:
        words = text.split()
        corrected_words = []

        for word in words:
            if len(word) > 2 and not word.isdigit() and not re.search(r"[0-9]", word):
                suggestions = self.sym_spell.lookup(
                    word, Verbosity.CLOSEST, max_edit_distance=2
                )
                if suggestions:
                    corrected_words.append(suggestions[0].term)
                    continue
            corrected_words.append(word)

        return " ".join(corrected_words)


class UniversalIDPEngine:
    def __init__(self, languages: List[str] = ["ar", "en"]):
        if torch.cuda.is_available():
            self.device = "cuda"
            use_gpu = True
        elif torch.backends.mps.is_available():
            self.device = "mps"
            use_gpu = True
        else:
            self.device = "cpu"
            use_gpu = False

        print(f"🚀 Initializing Dynamic IDP OCR Engine on Device: {self.device.upper()}")
        self.reader = easyocr.Reader(languages, gpu=use_gpu)
        self.spell_corrector = ArabicSpellCorrector()
        self.normalizer = DPINormalizer(target_dpi=300)

    def preprocess_image(self, input_img: np.ndarray) -> np.ndarray:
        normalized = self.normalizer.normalize_image(input_img)

        lab = cv2.cvtColor(normalized, cv2.COLOR_BGR2LAB)
        l_channel, a, b = cv2.split(lab)
        clahe = cv2.createCLAHE(clipLimit=2.0, tileGridSize=(8, 8))
        cl = clahe.apply(l_channel)
        limg = cv2.merge((cl, a, b))
        enhanced_bgr = cv2.cvtColor(limg, cv2.COLOR_LAB2BGR)

        return enhanced_bgr

    def process_document(self, file_bytes: bytes, filename: str) -> Dict[str, Any]:
        if filename.lower().endswith(".pdf"):
            payload = self._process_pdf(file_bytes)
        else:
            payload = self._extract_from_image_bytes(file_bytes)

        payload["filename"] = filename
        payload["processing_status"] = "SUCCESS"
        return payload

    def _process_pdf(self, pdf_bytes: bytes) -> Dict[str, Any]:
        doc = fitz.open(stream=pdf_bytes, filetype="pdf")
        all_raw_lines = []
        all_corrected_lines = []
        confidence_scores = []

        has_digital_text = any(len(page.get_text("text").strip()) > 50 for page in doc)

        if has_digital_text:
            for page in doc:
                native_text = page.get_text("text").strip()
                lines = [line.strip() for line in native_text.split("\n") if line.strip()]
                for line in lines:
                    all_raw_lines.append(line)
                    all_corrected_lines.append(self.spell_corrector.correct_text(line))
                confidence_scores.append(1.0)
        else:
            normalized_pages = self.normalizer.process(pdf_bytes)
            for page_img in normalized_pages:
                page_res = self._extract_from_image_array(page_img)
                all_raw_lines.extend(page_res["raw_extracted_text"])
                all_corrected_lines.extend(page_res["corrected_extracted_text"])
                confidence_scores.append(page_res["delivery_address"]["confidence"])

        full_corrected_text = " ".join(all_corrected_lines)
        avg_conf = float(np.mean(confidence_scores)) if confidence_scores else 0.0

        return self._format_output_payload(
            all_corrected_lines, all_raw_lines, full_corrected_text, avg_conf
        )

    def _extract_from_image_bytes(self, image_bytes: bytes) -> Dict[str, Any]:
        nparr = np.frombuffer(image_bytes, np.uint8)
        img = cv2.imdecode(nparr, cv2.IMREAD_COLOR)
        if img is None:
            raise ValueError("Unable to decode uploaded image file.")
        return self._extract_from_image_array(img)

    def _extract_from_image_array(self, img: np.ndarray) -> Dict[str, Any]:
        processed_img = self.preprocess_image(img)
        results = self.reader.readtext(processed_img, detail=1)

        raw_lines = []
        corrected_lines = []
        confidence_scores = []

        for bbox, text, conf in results:
            clean_text = text.strip()
            if clean_text:
                raw_lines.append(clean_text)
                confidence_scores.append(conf)
                corrected = self.spell_corrector.correct_text(clean_text)
                corrected_lines.append(corrected)

        full_corrected_text = " ".join(corrected_lines)
        avg_conf = float(np.mean(confidence_scores)) if confidence_scores else 0.0

        return self._format_output_payload(
            corrected_lines, raw_lines, full_corrected_text, avg_conf
        )

    def _format_output_payload(
        self, corrected_lines: List[str], raw_lines: List[str], full_text: str, confidence: float
    ) -> Dict[str, Any]:

        supplier = self._extract_supplier(corrected_lines)
        invoice_num = self._extract_invoice_number(full_text)
        acid_num = self._extract_acid_number(full_text)
        date_str = self._extract_date(full_text)
        currency = self._extract_currency(full_text)
        amount = self._extract_total_amount(full_text)
        
        ship_addr_text = self._extract_address_block(corrected_lines, "SHIP TO")
        bill_addr_text = self._extract_address_block(corrected_lines, "BILL TO")
        
        ship_city = self._extract_city(ship_addr_text)
        bill_city = self._extract_city(bill_addr_text)

        items = self._extract_line_items(corrected_lines, currency)

        return {
            "supplier": supplier,
            "exporter": supplier,
            "invoice_number": invoice_num,
            "acid_number": acid_num,
            "date": date_str,
            "total_amount": amount,
            "delivery_address": {
                "raw_text": ship_addr_text,
                "destination_city": ship_city,
                "confidence": round(confidence, 2),
            },
            "billing_address": {
                "raw_text": bill_addr_text,
                "destination_city": bill_city,
                "confidence": round(confidence, 2),
            },
            "items": items,
            "raw_extracted_text": raw_lines,
            "corrected_extracted_text": corrected_lines,
        }

    def _extract_supplier(self, lines: List[str]) -> Optional[str]:
        for i, line in enumerate(lines[:15]):
            upper_line = line.upper()
            if any(kw in upper_line for kw in ["EXPORTER", "SUPPLIER", "ADD:", "ADDRESS"]):
                if i + 1 < len(lines):
                    candidate = lines[i + 1].strip()
                    if len(candidate) > 2 and not re.search(r"^[0-9\W]+$", candidate):
                        return candidate

        for line in lines[:10]:
            if any(kw in line for kw in ["Ademco", "FZE", "Machinery", "Trading", "CDVI", "MANITOU", "Tyco", "شركة", "LIMITED", "CORP", "INC", "LLC"]):
                return line.strip()

        return lines[0] if lines else None

    def _extract_date(self, text: str) -> Optional[str]:
        patterns = [
            r"\b\d{4}[\./-]\d{1,2}[\./-]\d{1,2}\b",
            r"\b\d{1,2}[\./-]\d{1,2}[\./-]\d{2,4}\b",
            r"\b\d{1,2}-[A-Za-z]{3}-\d{4}\b"
        ]
        for pat in patterns:
            match = re.search(pat, text)
            if match:
                return match.group(0).strip()
        return None

    def _extract_currency(self, text: str) -> Optional[str]:
        match = re.search(r"(?:CURRENCY|CURRENCY OF SETTLEMENT)[\s:#]*([A-Z]{3})", text, re.IGNORECASE)
        if match:
            return match.group(1).upper()
        if "USD" in text:
            return "USD"
        if "EUR" in text or "€" in text:
            return "EUR"
        return "USD"

    def _extract_address_block(self, lines: List[str], header_target: str) -> str:
        block_lines = []
        capturing = False
        stop_headers = ["BILL TO", "SHIP TO", "FORWARDING AGENT", "ITEM", "SPECIAL INSTRUCTIONS", "INCOTERMS", "DESCRIPTION", "PAYMENT"]

        for line in lines:
            cleaned = line.strip()
            upper_cleaned = cleaned.upper()

            if header_target in upper_cleaned:
                capturing = True
                parts = re.split(r"[:#\-]", cleaned, maxsplit=1)
                if len(parts) > 1 and len(parts[1].strip()) > 3:
                    block_lines.append(parts[1].strip())
                continue

            if capturing:
                if any(hdr in upper_cleaned for hdr in stop_headers if hdr != header_target):
                    break
                if cleaned:
                    block_lines.append(cleaned)
                if len(block_lines) >= 4:
                    break

        if block_lines:
            return " - ".join(block_lines[:4])
        return "Address block unverified"

    def _extract_city(self, address_text: str) -> Optional[str]:
        if not address_text or address_text == "Address block unverified":
            return None

        known_cities = [
            "CAIRO", "ALEXANDRIA", "GIZA", "DUBAI", "SHARJAH", "JEDDAH",
            "PORT SAID", "SUEZ", "DAMIETTA", "AIN SOKHNA", "القاهرة", "الإسكندرية"
        ]

        for city in known_cities:
            if re.search(r"(?<![A-Za-z\u0600-\u06FF])" + re.escape(city) + r"(?![A-Za-z\u0600-\u06FF])", address_text, re.IGNORECASE):
                return city.upper()

        return None

    def _extract_acid_number(self, text: str) -> Optional[str]:
        patterns = [
            r"(?:ACID|ACID#|ACID\s*NO)[\s:#]*([0-9]{19})\b",
            r"\b([0-9]{19})\b"
        ]
        for pat in patterns:
            match = re.search(pat, text, re.IGNORECASE)
            if match:
                return match.group(1)
        return None

    def _extract_invoice_number(self, text: str) -> Optional[str]:
        patterns = [
            r"(?:INVOICE\s*(?:NO|N0|NUMBER|nbr|#)[\s:#\.-]*)([A-Za-z0-9\-/]+)",
            r"(?:FACTURE\s*/\s*INVOICE\s*No\.?\s*)([A-Za-z0-9\-/]+)",
            r"\b(GSD[0-9]{8})\b",
            r"\b(ZAY[0-9]{4}/[0-9]{2}/[0-9]{2})\b",
            r"\b(26[0-9]{7})\b"
        ]
        for pat in patterns:
            match = re.search(pat, text, re.IGNORECASE)
            if match:
                val = match.group(1).strip()
                if len(val) > 2:
                    return val
        return None

    def _extract_total_amount(self, text: str) -> Optional[float]:
        patterns = [
            r"(?:TOTAL\s*INVOICE\s*VALUE|TOTAL\s*AMOUNT|TOTAL\s*NET|A\s*PAYER|TO\s*PAY|INVOICE\s*TOTAL)[\s:#]*[\$€]?\s*([0-9]{1,3}(?:,[0-9]{3})*\.[0-9]{2})",
            r"(?:TOTAL\s*INVOICE\s*VALUE|TOTAL\s*AMOUNT|TOTAL\s*NET|A\s*PAYER|TO\s*PAY|INVOICE\s*TOTAL)[\s:#]*[\$€]?\s*([0-9\s]+\.[0-9]{2})"
        ]
        for pat in patterns:
            matches = re.findall(pat, text, re.IGNORECASE)
            if matches:
                cleaned = matches[-1].replace(" ", "").replace(",", "")
                try:
                    return float(cleaned)
                except ValueError:
                    continue
        
        decimals = re.findall(r"\b([0-9]{1,3}(?:,[0-9]{3})*\.[0-9]{2})\b", text)
        if decimals:
            vals = [float(d.replace(",", "")) for d in decimals]
            return max(vals) if vals else None
        return None

    def _extract_line_items(self, lines: List[str], currency: Optional[str]) -> List[Dict[str, Any]]:
        items = []
        full_text = "\n".join(lines)

        pattern = r"(?:00\d|\d{3})[\s\|]+(.*?)\s+([0-9,]+)\s*(?:EA|PCS|UNITS)?[\s\|]+([0-9,]+\.[0-9]{2})[\s\|]+([0-9,]+\.[0-9]{2})"
        matches = re.findall(pattern, full_text, re.IGNORECASE | re.DOTALL)

        for match in matches:
            desc_raw, qty_str, unit_p_str, total_p_str = match
            clean_desc = re.sub(r"\s+", " ", desc_raw.replace("|", "")).strip()

            try:
                items.append({
                    "item": clean_desc,
                    "quantity": int(qty_str.replace(",", "")),
                    "unit_price": float(unit_p_str.replace(",", "")),
                    "total_price": float(total_p_str.replace(",", "")),
                    "currency": currency or "USD"
                })
            except ValueError:
                continue

        return items


ocr_service = UniversalIDPEngine()